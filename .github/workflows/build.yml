name: WeaponSkins

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet publish WeaponSkins/WeaponSkins.csproj -c Release -o publish

      - name: Package
        run: |
          mkdir -p package/addons/counterstrikesharp/plugins/WeaponSkins
          mkdir -p package/addons/counterstrikesharp/gamedata

          cp publish/WeaponSkins.dll publish/MySqlConnector.dll package/addons/counterstrikesharp/plugins/WeaponSkins/
          cp -r publish/Data package/addons/counterstrikesharp/plugins/WeaponSkins/Data
          cp -r publish/lang package/addons/counterstrikesharp/plugins/WeaponSkins/lang
          cp publish/gamedata/weaponskins.json package/addons/counterstrikesharp/gamedata/weaponskins.json

      - uses: actions/upload-artifact@v7
        with:
          name: WeaponSkins
          path: package

      - name: Next version
        id: version
        if: github.event_name != 'pull_request'
        run: |
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          if [ -z "$latest" ]; then
            next="v1.0.0"
          else
            version=${latest#v}
            major=${version%%.*}
            rest=${version#*.}
            minor=${rest%%.*}
            patch=${rest##*.}
            patch=$((patch + 1))
            if [ "$patch" -gt 9 ]; then
              patch=0
              minor=$((minor + 1))
            fi
            if [ "$minor" -gt 9 ]; then
              minor=0
              major=$((major + 1))
            fi
            next="v$major.$minor.$patch"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Zip release
        if: github.event_name != 'pull_request'
        run: |
          python3 - <<'PACK'
          import os
          import zipfile

          with zipfile.ZipFile("WeaponSkins.zip", "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for folder, _, names in sorted(os.walk("package")):
                  for name in sorted(names):
                      path = os.path.join(folder, name)
                      entry = zipfile.ZipInfo(os.path.relpath(path, "package").replace(os.sep, "/"), (2026, 1, 1, 0, 0, 0))
                      entry.compress_type = zipfile.ZIP_DEFLATED
                      entry.create_system = 0
                      entry.external_attr = 0o600 << 16
                      with open(path, "rb") as handle:
                          archive.writestr(entry, handle.read())
          PACK

      - name: Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WeaponSkins ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: WeaponSkins.zip